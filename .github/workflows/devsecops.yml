name: AI-Driven DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  security-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run static analysis (Cppcheck XML)
        run: |
          cppcheck --enable=all --inconclusive --xml codes/ 2> reports/cppcheck-report.xml || true

      - name: Show Cppcheck XML report
        run: |
          echo "===== Cppcheck XML Report ====="
          cat reports/cppcheck-report.xml || true

      - name: Upload Cppcheck XML report
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-xml-report
          path: reports/cppcheck-report.xml